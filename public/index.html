<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="bundle.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Calcular tronco de cone circular reto (Copo)</title>
</head>
<body>
    <div class="container">
        <h1>Calcular tronco de cone circular reto (Copo)</h1>
        <br><br>
        <label for="altura">Digite o valor da altura (cm): </label><br>
        <input type="number" id="altura" step="any"><br><br>

        <label for="raioMenor">Digite o valor do raio menor (cm): </label><br>
        <input type="number" id="raioMenor" step="any"><br><br>

        <label for="raioMaior">Digite o valor do raio maior (cm): </label><br>
        <input type="number" id="raioMaior" step="any"><br><br>

        <button id="btnCalcular">Calcular</button>
        <br><br>
        <div id="resposta"></div>
    </div>
</body>
</html>
